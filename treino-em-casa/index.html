<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Treino em Casa</title>
    <meta
      name="description"
      content="App pessoal de exercícios físicos em casa, sem equipamento."
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <!-- Cabeçalho -->
      <header class="topo">
        <h1 class="topo__titulo">🏋️ Treino em Casa</h1>
        <p class="topo__sub">Seu treino, sem sair de casa</p>
      </header>

      <!-- Navegação -->
      <nav class="abas" id="abas">
        <button class="aba aba--ativa" data-aba="rotinas">Rotinas</button>
        <button class="aba" data-aba="exercicios">Exercícios</button>
        <button class="aba" data-aba="historico">Histórico</button>
      </nav>

      <main class="conteudo">
        <!-- TELA: Rotinas -->
        <section class="tela tela--ativa" id="tela-rotinas">
          <div class="resumo-semana" id="resumo-semana"></div>
          <h2 class="secao-titulo">Rotinas prontas</h2>
          <div class="lista-rotinas" id="lista-rotinas"></div>
        </section>

        <!-- TELA: Exercícios -->
        <section class="tela" id="tela-exercicios">
          <h2 class="secao-titulo">Biblioteca de exercícios</h2>
          <div class="filtros" id="filtros-nivel">
            <button class="chip chip--ativo" data-nivel="todos">Todos</button>
            <button class="chip" data-nivel="iniciante">Iniciante</button>
            <button class="chip" data-nivel="intermediario">Intermediário</button>
            <button class="chip" data-nivel="avancado">Avançado</button>
          </div>
          <div class="lista-exercicios" id="lista-exercicios"></div>
        </section>

        <!-- TELA: Histórico -->
        <section class="tela" id="tela-historico">
          <h2 class="secao-titulo">Seu histórico</h2>
          <div class="estatisticas" id="estatisticas"></div>
          <div class="lista-historico" id="lista-historico"></div>
        </section>
      </main>
    </div>

    <!-- TELA CHEIA: Treino em execução -->
    <div class="treino" id="treino" hidden>
      <div class="treino__cabecalho">
        <button class="treino__sair" id="btn-sair-treino" aria-label="Sair do treino">✕</button>
        <span class="treino__progresso" id="treino-progresso">1 / 6</span>
      </div>

      <div class="treino__corpo">
        <p class="treino__fase" id="treino-fase">Preparar</p>
        <h2 class="treino__exercicio" id="treino-exercicio">Exercício</h2>
        <div class="treino__cronometro" id="treino-cronometro">00:30</div>
        <p class="treino__meta" id="treino-meta"></p>
        <p class="treino__descricao" id="treino-descricao"></p>
      </div>

      <div class="treino__controles">
        <button class="btn btn--secundario" id="btn-pausar">Pausar</button>
        <button class="btn btn--primario" id="btn-proximo">Pular ➜</button>
      </div>
      <div class="treino__proximo" id="treino-proximo"></div>
    </div>

    <!-- MODAL: detalhe do exercício -->
    <div class="modal" id="modal-exercicio" hidden>
      <div class="modal__caixa">
        <button class="modal__fechar" id="modal-fechar" aria-label="Fechar">✕</button>
        <h3 class="modal__titulo" id="modal-titulo"></h3>
        <span class="modal__grupo" id="modal-grupo"></span>
        <p class="modal__descricao" id="modal-descricao"></p>
        <div class="modal__dica" id="modal-dica"></div>
      </div>
    </div>

    <script src="js/dados.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
